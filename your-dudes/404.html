  <meta name="site-base" content="auto">
  <script>
    /* GitHub Pages serves this page at ANY missing address (e.g. /repo/oops/deep/page),
       so relative links would break. This script works out the site's base path,
       sets a <base>, and then adds the icon, stylesheet and scripts. They are added
       here (not written in the HTML) so the browser never requests them from the
       wrong place. Leave content="auto" in the meta tag above. If auto-detection
       ever fails, set it to your repository path, e.g. content="/your-repo/"
       (or "/" for a custom domain). */
    (function () {
      var base = "";
      try {
        if (location.protocol !== "file:") {
          var m = document.querySelector('meta[name="site-base"]');
          base = m && m.content && m.content !== "auto" ? m.content : null;
          if (base === null) {
            var segs = location.pathname.split("/").filter(Boolean);
            var cands = [];
            if (segs.length) cands.push("/" + segs[0] + "/");
            cands.push("/");
            base = "/";
            for (var i = 0; i < cands.length; i++) {
              var x = new XMLHttpRequest();
              x.open("HEAD", cands[i] + "site-config.js", false);
              try { x.send(); if (x.status >= 200 && x.status < 300) { base = cands[i]; break; } } catch (e) {}
            }
          }
          if (base.charAt(base.length - 1) !== "/") base += "/";
          base = base.replace(/[^A-Za-z0-9\-._~\/%]/g, "");
        }
      } catch (e) { base = ""; }
      var out = base ? '<base href="' + base + '">' : "";
      out += '<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">' +
             '<link rel="stylesheet" href="assets/css/styles.css">' +
             '<script src="site-config.js"><\/script>' +
             '<script src="assets/js/main.js"><\/script>';
      document.write(out);
    })();
  </script>
  <noscript><link rel="stylesheet" href="assets/css/styles.css"></noscript>
